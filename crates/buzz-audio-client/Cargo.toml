[package]
name = "buzz-audio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Huddle audio transport and codecs without a desktop application"

[features]
default = ["native-roots"]
native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
# Preserve the fork compatibility pin that removes the unused vulnerable ringbuf dependency.
neteq = { git = "https://github.com/security-union/videocall-rs.git", rev = "16729881b0a80022a7cbe0acc94c9becf2fad313", default-features = false }
opus = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util"] }
