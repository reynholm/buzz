{
  "name": "Guarded fork release preparation",
  "on": {
    "schedule": [{"cron": "0 6 * * *"}],
    "workflow_dispatch": {}
  },
  "concurrency": {"group": "fork-release-preparation", "cancel-in-progress": false},
  "permissions": {"contents": "write", "pull-requests": "write"},
  "jobs": {
    "select": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "outputs": {"target_sha": "${{ steps.select.outputs.target_sha }}"},
      "steps": [
        {"uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10", "with": {"ref": "fork/main", "fetch-depth": 0}},
        {"id": "select", "run": "python3 scripts/fork/sync.py select --report selection.json"},
        {"uses": "actions/upload-artifact@v4", "with": {"name": "fork-selection", "path": "selection.json"}}
      ]
    },
    "baseline": {
      "needs": ["select"],
      "if": "${{ needs.select.outputs.target_sha != '' }}",
      "runs-on": "macos-15",
      "timeout-minutes": 180,
      "steps": [
        {"name": "Require native Apple Silicon host", "run": "test \"$(uname -m)\" = arm64"},
        {"uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10", "with": {"ref": "fork/main", "fetch-depth": 0}},
        {"uses": "cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616"},
        {"uses": "actions/download-artifact@v4", "with": {"name": "fork-selection"}},
        {"name": "Fetch exact selected clean target", "env": {"TARGET_SHA": "${{ needs.select.outputs.target_sha }}"}, "run": "git fetch --no-tags https://github.com/block/buzz.git \"$TARGET_SHA\"\ntest \"$(git rev-parse FETCH_HEAD)\" = \"$TARGET_SHA\""},
        {"name": "Clean target gates and real arm64 build", "env": {"TARGET_SHA": "${{ needs.select.outputs.target_sha }}"}, "run": "python3 scripts/fork/sync.py baseline --target-sha \"$TARGET_SHA\" --report baseline.json"},
        {"name": "Record independent upstream baseline", "if": "${{ always() }}", "uses": "actions/upload-artifact@v4", "with": {"name": "clean-upstream-baseline", "path": "baseline*", "if-no-files-found": "error"}}
      ]
    },
    "candidate": {
      "needs": ["select", "baseline"],
      "if": "${{ needs.baseline.result == 'success' && needs.select.outputs.target_sha != '' }}",
      "runs-on": "macos-15",
      "timeout-minutes": 180,
      "env": {"GH_TOKEN": "${{ github.token }}", "CI": "true"},
      "steps": [
        {"name": "Require native Apple Silicon host", "run": "test \"$(uname -m)\" = arm64"},
        {"uses": "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10", "with": {"ref": "fork/main", "fetch-depth": 0}},
        {"uses": "cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616"},
        {"uses": "actions/download-artifact@v4", "with": {"name": "fork-selection"}},
        {"uses": "actions/download-artifact@v4", "with": {"name": "clean-upstream-baseline"}},
        {"name": "Require owner-configured maintenance author", "env": {"AUTHOR_NAME": "${{ vars.FORK_GIT_AUTHOR_NAME }}", "AUTHOR_EMAIL": "${{ vars.FORK_GIT_AUTHOR_EMAIL }}"}, "run": "test -n \"$AUTHOR_NAME\" && test -n \"$AUTHOR_EMAIL\"\ngit config user.name \"$AUTHOR_NAME\"\ngit config user.email \"$AUTHOR_EMAIL\"\ngit config --unset-all commit.gpgsign || test $? = 5"},
        {"id": "prepare", "name": "Prepare or publish clean blocked draft", "run": "python3 scripts/fork/sync.py prepare --base fork/main --baseline-report baseline.json --report preparation.json --publish"},
        {"id": "report_upload", "name": "Preserve preparation report on failure", "if": "${{ always() }}", "uses": "actions/upload-artifact@v4", "with": {"name": "fork-preparation-report", "path": "preparation.json", "if-no-files-found": "error"}},
        {"name": "Full fork Python regression suite", "working-directory": "${{ steps.prepare.outputs.worktree }}", "run": "python3 -m unittest discover -s scripts/fork/tests -v"},
        {"name": "Full companion acceptance gates", "working-directory": "${{ steps.prepare.outputs.worktree }}", "run": "git rev-parse HEAD\npnpm install --frozen-lockfile\njust mobile-install\njust fmt-check clippy test-unit desktop-check desktop-typecheck desktop-tauri-fmt-check desktop-tauri-test desktop-test\npnpm --dir desktop lint\npnpm --dir desktop build\njust ci"},
        {"name": "M3 real candidate build and verification", "working-directory": "${{ steps.prepare.outputs.worktree }}", "env": {"CANDIDATE_SHA": "${{ steps.prepare.outputs.candidate_sha }}"}, "run": "test \"$(git rev-parse HEAD)\" = \"$CANDIDATE_SHA\"\nunset BUZZ_UPDATER_ENDPOINT BUZZ_UPDATER_PUBLIC_KEY\ntest -x scripts/fork/build-candidate.sh\ntest -f scripts/fork/verify_artifact.py\nscripts/fork/build-candidate.sh --candidate-sha \"$CANDIDATE_SHA\" --baseline-report \"$GITHUB_WORKSPACE/baseline.json\""},
        {"name": "Upload verified candidate artifacts", "uses": "actions/upload-artifact@v4", "with": {"name": "fork-candidate-${{ steps.prepare.outputs.candidate_sha }}", "path": "${{ steps.prepare.outputs.worktree }}/artifacts/fork/*", "if-no-files-found": "error"}},
        {"name": "Link candidate evidence while keeping PR draft", "env": {"RUN_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}, "run": "python3 scripts/fork/sync.py link-artifact --report preparation.json --artifact-url \"$RUN_URL\" --publish"}
      ]
    },
    "report": {
      "needs": ["select", "baseline", "candidate"],
      "if": "${{ always() && needs.select.outputs.target_sha != '' }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 5,
      "steps": [
        {"uses": "actions/download-artifact@v4", "with": {"pattern": "*report", "path": "reports"}},
        {"uses": "actions/download-artifact@v4", "with": {"name": "clean-upstream-baseline", "path": "reports/upstream"}},
        {"uses": "actions/upload-artifact@v4", "with": {"name": "fork-sync-diagnostics", "path": "reports", "if-no-files-found": "error"}}
      ]
    }
  }
}
